# =============================================================================
# IMAGE CARD DOWNLOADERS - Reusable runtime pool for Home Assistant camera cards
# =============================================================================

artwork_image:
  - url: "https://placehold.co/1x1/000000/000000.jpg"
    id: image_card_download_1
    format: AUTO
    type: RGB565
    byte_order: LITTLE_ENDIAN
    resize: 1x1
    resize_mode: COVER
    buffer_size: 8192
    allow_insecure_local_urls: true
    p4_pipeline: TILE

  - url: "https://placehold.co/1x1/000000/000000.jpg"
    id: image_card_download_2
    format: AUTO
    type: RGB565
    byte_order: LITTLE_ENDIAN
    resize: 1x1
    resize_mode: COVER
    buffer_size: 8192
    allow_insecure_local_urls: true
    p4_pipeline: TILE

  - url: "https://placehold.co/1x1/000000/000000.jpg"
    id: image_card_download_3
    format: AUTO
    type: RGB565
    byte_order: LITTLE_ENDIAN
    resize: 1x1
    resize_mode: COVER
    buffer_size: 8192
    allow_insecure_local_urls: true
    p4_pipeline: TILE

  - url: "https://placehold.co/1x1/000000/000000.jpg"
    id: image_card_download_4
    format: AUTO
    type: RGB565
    byte_order: LITTLE_ENDIAN
    resize: 1x1
    resize_mode: COVER
    buffer_size: 8192
    allow_insecure_local_urls: true
    p4_pipeline: TILE

  - url: "https://placehold.co/1x1/000000/000000.jpg"
    id: image_card_modal_download_1
    format: AUTO
    type: RGB565
    byte_order: LITTLE_ENDIAN
    resize: 1x1
    resize_mode: COVER
    buffer_size: 8192
    allow_insecure_local_urls: true
    p4_pipeline: MODAL

interval:
  - interval: 250ms
    then:
      - lambda: |-
          image_card_refresh_due();

  # Custom branch: keep an expanded camera/image reasonably fresh without
  # turning the panel into a video client.
  - interval: 5s
    then:
      - lambda: |-
          const auto &display = id(espcontrol_app).display();
          const bool visible =
              (display.current_mode_is(espcontrol::DisplayMode::ACTIVE) ||
               display.current_mode_is(espcontrol::DisplayMode::DIMMED)) &&
              (display.target_mode_is(espcontrol::DisplayMode::ACTIVE) ||
               display.target_mode_is(espcontrol::DisplayMode::DIMMED));
          if (visible) refresh_visible_image_cards_forced(true);

  # The small tile gets a slower refresh so it stays useful without constantly
  # downloading snapshots in the background.
  - interval: 10s
    then:
      - lambda: |-
          const auto &display = id(espcontrol_app).display();
          const bool visible =
              (display.current_mode_is(espcontrol::DisplayMode::ACTIVE) ||
               display.current_mode_is(espcontrol::DisplayMode::DIMMED)) &&
              (display.target_mode_is(espcontrol::DisplayMode::ACTIVE) ||
               display.target_mode_is(espcontrol::DisplayMode::DIMMED));
          if (visible) refresh_visible_image_cards_forced(false);
